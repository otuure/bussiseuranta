<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Föli Seuraava Lähtö</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<h1>Föli - Seuraava lähtö</h1>
<div class="search-container">
<input type="text" id="searchInput" placeholder="Hae pysäkkiä nimellä tai numerolla" autocomplete="off">
<div id="searchResults" class="search-results"></div>
</div>
<div id="stopInfo" class="hidden">
<h2 id="stopName"></h2>
<div class="main-departure">
<div id="mainLine" class="line"></div>
<div id="mainTime" class="time"></div>
<div id="mainDestination" class="destination"></div>
</div>
<div class="next-departures">
<div class="departure-card"><div id="next1Line"></div><div id="next1Time"></div><div id="next1Destination"></div></div>
<div class="departure-card"><div id="next2Line"></div><div id="next2Time"></div><div id="next2Destination"></div></div>
</div>
<div id="updated"></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
